[mypy]
# Global settings for all packages - moderately strict by default
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
disable_error_code = attr-defined

# Default configuration for new packages
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-wandb.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

# The text-latent VAE package (project/). torch's ``nn.Module.__getattr__`` is typed as
# ``Tensor | Module``, and transformers/diffusers/torchvision entry points such as
# ``from_pretrained`` and ``transforms.Compose`` return ``Any``. The resulting
# "Returning Any" reports carry no type information about our own code, so they are
# disabled here; every other check (including attr-defined) stays on for this package.
[mypy-project.*]
disable_error_code = no-any-return
