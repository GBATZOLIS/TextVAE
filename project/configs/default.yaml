# Reference configuration — the paper's model as literally as possible.
#
#   * GPT-2 prior (frozen) => |V| = 50257, d_LM = 768
#   * ViT-B/16 vision encoder
#   * GPT-2-initialised text decoder with new cross-attention layers
#   * pixel-space DDPM (Eq. 7 applied to x_0 directly), 1000 train timesteps
#   * beta = 1.0, constant  => exactly the ELBO of Eq. 1 / Eq. 8
#
# It trains at 64x64 so that a pixel-space UNet is affordable on one GPU. For higher
# resolutions see coco.yaml, which switches to latent diffusion.

model:
  encoder:
    latent_length: 32              # T in z = (z_1, ..., z_T)
    projector_layers: 2
    projector_dropout: 0.1
    vision:
      name: google/vit-base-patch16-224
      backend: auto
      pretrained: true
      freeze_backbone: true        # only the projector + text decoder learn on the image side
      image_size: 224
      include_cls_token: false
      input_range: symmetric
    text_decoder:
      backend: gpt2                # GPT-2 + add_cross_attention (shares |V| with the prior)
      pretrained: true
      dropout: 0.1
      tie_lm_head: true
      lora:
        enabled: false             # set true to train GPT-2 cheaply via LoRA

  prior:
    name: gpt2                     # frozen; also provides the tokenizer and E_LM
    pretrained: true
    dtype: float32

  gumbel:
    schedule: exponential          # tau: 1.0 -> 0.1 (§3.2)
    tau_start: 1.0
    tau_end: 0.1
    anneal_steps: 50000
    warmup_steps: 0
    hard: true                     # straight-through: discrete forward, soft backward
    straight_through: true
    eval_temperature: 0.1

  decoder:
    image_space: pixel             # Eq. 7 on x_0 itself
    context_projection: linear     # d_LM (768) -> cross_attention_dim
    num_train_timesteps: 1000      # T_diff
    beta_schedule: scaled_linear
    beta_start: 0.00085
    beta_end: 0.012
    prediction_type: epsilon
    clip_sample: false
    min_snr_gamma: null            # off => uniform weights, exactly Eq. 7
    cond_dropout_prob: 0.0         # off => no classifier-free guidance training
    num_inference_steps: 50
    guidance_scale: 1.0
    inference_scheduler: ddim
    unet:
      pretrained: false
      sample_size: 64
      in_channels: 3
      out_channels: 3
      block_out_channels: [128, 256, 384, 512]
      layers_per_block: 2
      down_block_types:
        [DownBlock2D, CrossAttnDownBlock2D, CrossAttnDownBlock2D, CrossAttnDownBlock2D]
      up_block_types:
        [CrossAttnUpBlock2D, CrossAttnUpBlock2D, CrossAttnUpBlock2D, UpBlock2D]
      cross_attention_dim: 768
      attention_head_dim: 8
      norm_num_groups: 32
      gradient_checkpointing: false

loss:
  beta: 1.0                        # Eq. 8
  beta_schedule: constant
  kl_estimator: relaxed            # score the Gumbel sample (differentiable through log p)
  kl_reduction: sum                # Eq. 6 sums over t
  free_bits: 0.0
  aux_caption_ce_weight: 0.0

# Data paths are environment-specific. This points at the images actually present in
# this repo: data/images holds COCO val2017 (5k) *and* Visual Genome (108k) side by side,
# with data/merged_captions.json covering both. The ELBO is unsupervised, so using the
# whole folder gives 113k training images; captions are only used for logging and for the
# optional caption warm-start.
#
# For COCO val2017 alone (5k images, canonical captions) swap the three keys below for:
#   dataset: coco
#   root: data/images
#   ann_file: data/annotations/captions_val2017.json
# (captions_train2017.json references files that are not present here.)
data:
  dataset: image_folder
  root: data/images
  caption_file: data/merged_captions.json
  image_size: 64
  center_crop: true
  random_flip: true
  batch_size: 16
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  drop_last: true
  shuffle: true

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  grad_accum_steps: 1
  scheduler: cosine
  warmup_steps: 500
  min_lr_ratio: 0.0

train:
  output_dir: runs/textvae
  run_name: default
  seed: 42
  max_steps: 100000
  mixed_precision: bf16
  log_every: 10
  val_every: 1000
  sample_every: 1000
  ckpt_every: 1000
  keep_last_n: 3
  num_log_samples: 4
  resume: ""                       # "auto" resumes the latest checkpoint in output_dir
  ema:
    enabled: false
    decay: 0.999
  tracker:
    tensorboard: true
    wandb: false
    wandb_project: text-latent-vae
