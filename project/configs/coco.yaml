# Practical COCO run at 256x256 via latent diffusion.
#
# Differences from default.yaml, all documented deviations rather than simplifications:
#   * image_space: vae  -> the frozen SD autoencoder maps x_0 to a 32x32x4 latent, which
#     makes 256px training fit on a single 24GB GPU. Eq. 7 is unchanged, it just acts on
#     VAE latents.
#   * beta is warmed up 0 -> 0.01. beta = 1 with a summed 32-token KL dwarfs the per-pixel
#     MSE early on and collapses the posterior to the prior; the warm-up is the standard
#     remedy. Set beta: 1.0 / beta_schedule: constant to recover the exact ELBO.
#   * classifier-free guidance is trained (10% conditioning dropout) so reconstructions
#     can be sharpened at inference with guidance_scale > 1.

_base_: default.yaml

model:
  encoder:
    latent_length: 32
    vision:
      name: openai/clip-vit-large-patch14
      image_size: 224
      freeze_backbone: true
  decoder:
    image_space: vae
    vae_name: stabilityai/sd-vae-ft-mse
    cond_dropout_prob: 0.1
    guidance_scale: 3.0
    num_inference_steps: 50
    unet:
      pretrained: false
      sample_size: 32              # 256 / 8 (VAE downsampling factor)
      in_channels: 4               # must equal the VAE's latent_channels
      out_channels: 4
      block_out_channels: [320, 640, 1280]
      layers_per_block: 2
      down_block_types: [CrossAttnDownBlock2D, CrossAttnDownBlock2D, CrossAttnDownBlock2D]
      up_block_types: [CrossAttnUpBlock2D, CrossAttnUpBlock2D, CrossAttnUpBlock2D]
      cross_attention_dim: 768
      gradient_checkpointing: true

loss:
  beta: 0.01
  beta_schedule: linear
  beta_start: 0.0
  beta_end: 0.01
  beta_warmup_steps: 1000
  beta_anneal_steps: 10000
  kl_estimator: relaxed
  kl_reduction: sum

data:
  dataset: coco
  root: data/images
  ann_file: data/annotations/captions_train2017.json
  image_size: 256
  batch_size: 8
  num_workers: 8

optim:
  lr: 5.0e-5
  grad_accum_steps: 4
  warmup_steps: 1000

train:
  run_name: coco256
  max_steps: 200000
  mixed_precision: bf16
  val_every: 2000
  sample_every: 2000
  ckpt_every: 2000
  ema:
    enabled: true
    decay: 0.9995
